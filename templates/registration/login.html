<!-- mi_primer_proyecto/templates/registration/login.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .login-container { background-color: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; box-sizing: border-box; }
        h1 { color: #0056b3; margin-bottom: 30px; }
        form { display: flex; flex-direction: column; gap: 15px; }
        input[type="text"], input[type="password"] { padding: 12px; border: 1px solid #ced4da; border-radius: 5px; font-size: 1em; width: 100%; box-sizing: border-box; }
        button[type="submit"] { padding: 12px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 1.1em; cursor: pointer; transition: background-color 0.3s ease; }
        button[type="submit"]:hover { background-color: #0056b3; }
        .errorlist { color: red; list-style: none; padding: 0; margin-top: -10px; margin-bottom: 10px; }
        .back-button { display: inline-block; margin-top: 20px; padding: 10px 25px; font-size: 1.0em; font-weight: bold; color: #fff; background-color: #6c757d; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; transition: background-color 0.3s ease, transform 0.2s ease; }
        .back-button:hover { background-color: #5a6268; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Iniciar Sesión</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }} {# Esto renderiza los campos de usuario y contraseña #}
            <button type="submit">Entrar</button>
        </form>
        <a href="{% url 'home' %}" class="back-button">Volver a la Página Principal</a>
    </div>
</body>
</html>
